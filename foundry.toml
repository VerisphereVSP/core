[profile.default]
extra_output = ["storageLayout"]  # patch_storage_layout_gate: emit storage layout for the CI gate
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
cache = true
optimizer = true
optimizer_runs = 200 
via_ir = true
# patch_settlement_snapshots: pin the compiler. StakeEngine sits 116 B under EIP-170 with 0.8.33; an
# auto-selected newer solc could size it differently and fail `forge build --sizes` in CI.
solc = "0.8.33"
# patch_settlement_snapshots: the F-D acceptance test builds a 1,000-link flood inside one test tx
# (~1.5e9 gas of setup); the default 2^30 cap is too small for it. This is the TEST runner's cap, not
# a chain parameter.
gas_limit = 4000000000

fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read-write", path = "./broadcast" }
]

remappings = [
    "openzeppelin-contracts/=lib/openzeppelin-contracts/",
    "@chainlink/contracts/=lib/chainlink-brownie-contracts/contracts/",
    "@prb/math/=lib/prb-math/"
]

[rpc_endpoints]
fuji = "${FUJI_RPC}"

[etherscan]
# Fuji: No API key required; Foundry uses placeholder internally
fuji = { key = "", chain = 43113 }

# For Avalanche mainnet, RouteScan *does* require a key (optional for now)
avalanche = { key = "", chain = 43114 }


[fmt]
single_line_statement_blocks = "multi"

[profile.ci]
# Inherits [profile.default] (incl. extra_output=storageLayout) and the
# standalone [fmt] (== [profile.default.fmt]). Declared so FOUNDRY_PROFILE=ci
# in CI selects a real profile instead of falling back with a warning.
